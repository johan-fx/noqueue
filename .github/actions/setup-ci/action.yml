name: Setup CI dependencies
description: Install the pinned Node/pnpm toolchain and frozen workspace dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22.19.0
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
