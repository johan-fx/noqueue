name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production preparation without remote operations
        run: pnpm test:production && pnpm production:check
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm --filter '!@noqueue/api' --filter '!@noqueue/root' -r --if-present test
      - run: pnpm build
      - name: Build isolated production artifacts with GA disabled
        run: pnpm production:build
      - run: pnpm --filter @noqueue/e2e exec playwright install --with-deps chromium firefox webkit
      - name: Verify real production bundles remain analytics-disabled
        run: pnpm --filter @noqueue/e2e test:production
      - name: Verify privacy gates in Chromium, Firefox and WebKit
        run: pnpm --filter @noqueue/e2e test:privacy
      - name: Verify safe PWA release transitions
        run: pnpm --filter @noqueue/e2e test:pwa
        env:
          QUEUE_REPORT_DIR: ${{ github.workspace }}/queue-reports/pwa
      - run: node scripts/queue-verification/run.mjs --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-verification
          path: queue-reports/
          retention-days: 14
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noqueue/web build
      - name: Sync the Android Capacitor project
        run: pnpm --filter @noqueue/mobile exec cap sync android
      - name: Verify Android sync has no tracked drift
        run: git diff --exit-code -- apps/mobile/capacitor.config.ts apps/mobile/android
      - name: Compile Android debug application
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
